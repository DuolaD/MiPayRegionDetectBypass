name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 准备签名密钥
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::未配置 SIGNING_KEYSTORE_BASE64，将使用临时生成的调试密钥签名，各版本签名不一致，无法覆盖安装。"
            echo "KEYSTORE=$RUNNER_TEMP/debug.keystore" >> "$GITHUB_ENV"
          fi

      - name: 构建 APK
        env:
          VERSION_NAME: ${{ github.event.release.tag_name }}
          KS_PASS: ${{ secrets.SIGNING_KEYSTORE_PASSWORD || 'android' }}
          KS_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS || 'androiddebugkey' }}
        run: ./build.sh

      - name: 上传到 Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" out/*.apk --clobber --repo "$GITHUB_REPOSITORY"
